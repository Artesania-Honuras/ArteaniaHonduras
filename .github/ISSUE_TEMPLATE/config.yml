# Configuración del selector de incidencias de Artesanías De Honduras.
#
# No hay plantillas de incidencia: este repositorio es privado de contenido y
# no recibe reportes de terceros. Se deja abierta la opción de crear una
# incidencia en blanco para notas internas del equipo.

blank_issues_enabled: true

contact_links:

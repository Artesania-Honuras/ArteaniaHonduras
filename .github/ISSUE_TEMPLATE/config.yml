# Configuración del selector de incidencias de Artesanías De Honduras.
#
# No hay plantillas de incidencia: este repositorio es privado de contenido y
# no recibe reportes de terceros. Se deja abierta la opción de crear una
# incidencia en blanco para notas internas del equipo.

blank_issues_enabled: true

contact_links:
  # Canal oficial de atención. El número es el real y está publicado en el
  # sitio: CONTACTO.whatsapp.numero en src/config/site.ts.
  - name: Consultas sobre productos y pedidos (WhatsApp)
    url: https://wa.me/50499653413
    about: Escríbenos por WhatsApp para consultar precios, disponibilidad, envíos y pedidos. Canal oficial de atención de Artesanías De Honduras.
